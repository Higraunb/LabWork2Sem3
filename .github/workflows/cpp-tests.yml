name: C++ Tests - Fixed GTest

on:
  push:
    branches: [ main, master, newBranch ]
  pull_request:
    branches: [ main, master, newBranch ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build project
      run: |
        cd build
        make -j4

    - name: Run tests
      run: |
        cd build
        ./tests/MatrixTest
