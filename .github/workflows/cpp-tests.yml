name: C++ Tests - Fixed GTest

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build Google Test from source
      run: |
        # Клонируем и собираем gtest правильно
        git clone https://github.com/google/googletest.git /tmp/googletest
        cd /tmp/googletest
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake ..

    - name: Build project
      run: |
        cd build
        make -j4

    - name: Run tests
      run: |
        cd build/TTriangleMatrixTest
        ./TTriangleMatrix_Test
