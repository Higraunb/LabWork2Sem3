name: C++ Tests with GTest Action

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup C++ environment
      uses: actions/setup-cpp@v1
      with:
        cc: gcc
        cxx: g++

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgtest-dev

    - name: Configure and build
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j4

    - name: Run tests
      run: |
        cd build/TTriangleMatrixTest
        ./TTriangleMatrix_Test
